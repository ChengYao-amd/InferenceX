schema: 2
base:
  name: glm5.2-fp4-mi355x-infera-atom-agentic-disagg
  slurm:
    time_limit: '06:00:00'
  resources:
    gpu_type: mi355x
    gpus_per_node: 8
  sbatch_directives:
    mem: '0'
  srun_options:
    mem: '0'
    container-writable: ''
    container-remap-root: ''
  container_mounts:
    /dev/infiniband: /dev/infiniband
  frontend:
    type: infera
    enable_multiple_frontends: false
    env:
      HF_HOME: /hf_hub_cache
    args:
      router-backend: python
      router-policy: round-robin
      kv-event-transport: zmq
      # One worker per role: an open breaker would leave the router no target.
      breaker-failure-threshold: 0
  observability:
    enabled: false
    tachometer:
      enabled: false
  engine:
    type: atom
    mooncake_protocol: rdma
  roles:
    prefill:
      nodes: 1
      workers: 1
      gpus: 4
      env:
        <<: &common_env
          HF_HOME: /hf_hub_cache
          PYTHONHASHSEED: '0'
          AITER_QUICK_REDUCE_QUANTIZATION: INT4
          AITER_USE_FLYDSL_MOE_SORTING: '1'
          AITER_LOG_LEVEL: WARNING
          ATOM_MLA_PAGE_SIZE: '1'
          ATOM_ONLINE_QUANT_STREAMING: '0'
          ATOM_SPARSE_INDEXER_LOGITS_BUDGET_MB: '2047'
          ATOM_USE_TRITON_MLA: '0'
          MC_ENABLE_DEST_DEVICE_AFFINITY: '1'
          MC_GID_INDEX: '@fabric.rdma-gid-index'
          MOONCAKE_DISABLE_HIP_DMABUF: '1'
          # P and D see disjoint GPUs on one host: keep KV on the RDMA rails.
          MC_DISABLE_HIP: '1'
          INFERA_ATOM_READY_TIMEOUT: '3600'
        # The fabric routes same-numbered rails only: write on the served decode rank's rail.
        ATOM_MOONCAKE_MATCHED_RAILS: auto
        OFFLOAD_PROFILE: '0'
        VLLM_PP_LAYER_PARTITION: '20,20,20,18'
        LMCACHE_LOCAL_CPU: 'True'
        LMCACHE_MAX_LOCAL_CPU_SIZE: '256'
        LMCACHE_CHUNK_SIZE: '256'
        LMCACHE_NUMA_MODE: auto
        # PP stages hold distinct KV, so lookups query all four local ranks.
        LMCACHE_LOOKUP_SERVER_WORKER_IDS: '0,1,2,3'
        OFFLOAD_MIN_LOAD_TOKENS: '0'
        # The image's LMCache CPU pool is GTT (hipHostMalloc) only with userptr paging off.
        HSA_USERPTR_FOR_PAGED_MEM: '0'
      args:
        <<: &common_args
          trust-remote-code: true
          kv_cache_dtype: fp8
          # The PP prefill writes each decode DCP rank's pages: one block size on both sides.
          block-size: 16
          enable_prefix_caching: true
          # model.layers.78 is the BF16 MTP head; online ptpc_fp8 skips it and the MXFP4 experts.
          online_quant_config: '{"global_quant_config":"ptpc_fp8","exclude_layer":["lm_head","model.embed_tokens","*.mlp.gate","model.layers.[0-9].mlp.*expert*","model.layers.[1-6][0-9].mlp.*expert*","model.layers.7[0-7].mlp.*expert*","model.layers.78.*"]}'
          method: mtp
        pipeline-parallel-size: 4
        # ATOM runs pipeline parallelism without CUDA graphs.
        enforce-eager: true
        gpu-memory-utilization: 0.85
        max-num-batched-tokens: 8192
        max-num-seqs: 512
        mooncake-connector-config:
          # ATOM's default 16 hangs an RDMA write; 1 misses the 120 s transfer deadline.
          num_worker_threads: 4
        extra-kv-connectors:
          - kv_connector: lmcache_offload
            kv_role: offload
    decode:
      nodes: colocate
      workers: 1
      gpus: 4
      env: *common_env
      args:
        <<: *common_args
        decode-context-parallel-size: 4
        gpu-memory-utilization: 0.90
        max-num-batched-tokens: 16384
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'atom:'
      AIPERF_APPLY_CHAT_TEMPLATE: 'true'
      AIPERF_HTTP_TCP_USER_TIMEOUT: '900000'
      AGENTIC_WARMUP_GRACE_PERIOD: '1800'
      AIPERF_LIVE_FAILED_REQUEST_THRESHOLD: '0.25'

override_pp4_dcp4_c32:
  roles:
    prefill:
      args:
        num-speculative-tokens: 4
    decode:
      args:
        num-speculative-tokens: 4
        max-num-seqs: 64
        cudagraph-capture-sizes: '[1,2,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64]'

override_pp4_dcp4_c48:
  roles:
    prefill:
      args:
        num-speculative-tokens: 3
    decode:
      args:
        num-speculative-tokens: 3
        max-num-seqs: 96
        cudagraph-capture-sizes: '[1,2,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96]'

override_pp4_dcp4_c64:
  roles:
    prefill:
      args:
        num-speculative-tokens: 3
    decode:
      args:
        num-speculative-tokens: 3
        max-num-seqs: 128
        cudagraph-capture-sizes: '[1,2,4,8,12,16,20,24,28,32,36,40,44,48,52,56,60,64,68,72,76,80,84,88,92,96,100,104,108,112,116,120,124,128]'
